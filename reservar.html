<head>
    <meta charset="UTF-8">

    <!-- Bootstrap -->
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
 <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark menu">
        <div class="container">

            <!-- LOGO -->
           <a class="navbar-brand" href="#">
    <img src="img/logo.png" alt="logo" class="logo">
</a>

            <!-- BOTON MOBILE -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- ITEMS -->
            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sobrenosotros.html">Vení a entrenar</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="actividades.html">Actividades</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="clasesyhorarios.html">Clases y horarios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="planesyprecios.html">Planes y precios</a>
                    </li>

                    <li class="nav-item">
    <a class="nav-link active" href="reservar.html">
        Reservar Clase
    </a>
</li>

                </ul>

            </div>
        </div>
    </nav>

    <section class="py-5">

    <div class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Reservá tu Clase Gratuita
            </h1>

            <p>
                Completá tus datos y elegí el día para conocernos.
            </p>

        </div>

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow p-4">

                    <form>

                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre y Apellido
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Ingresá tu nombre completo"
                                required>

                        </div>

                        <!-- MAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="ejemplo@email.com"
                                required>

                        </div>

                        <!-- TELEFONO -->

                        <div class="mb-3">

                            <label class="form-label">
                                Teléfono
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                placeholder="11 1234 5678"
                                required>

                        </div>

                        <!-- ACTIVIDAD -->

                        <div class="mb-3">

                            <label class="form-label">
                                Actividad de interés
                            </label>

                            <select class="form-select" required>

                                <option selected disabled>
                                    Seleccioná una actividad
                                </option>

                                <option>
                                    CrossFit
                                </option>

                                <option>
                                    Entrenamiento Funcional
                                </option>

                            </select>

                        </div>

                        <!-- FECHA -->

                        <div class="mb-3">

                            <label class="form-label">
                                Fecha de prueba
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                required>

                        </div>

                        <!-- HORARIO -->

                        <div class="mb-4">

                            <label class="form-label">
                                Horario
                            </label>

                            <select class="form-select" required>

                                <option selected disabled>
                                    Seleccioná un horario
                                </option>

                                <option>08:00 hs</option>
                                <option>10:00 hs</option>
                                <option>14:00 hs</option>
                                <option>16:00 hs</option>
                                <option>18:00 hs</option>
                                <option>20:00 hs</option>

                            </select>

                        </div>

                        <!-- BOTON -->

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn btn-dark btn-lg">

                                RESERVAR CLASE

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
    
</body>
</html>
